<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code or "Error" }} — LinkForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>
<body>
    <div class="app-layout">
        <header class="app-header">
            <div class="header-inner">
                <a href="/" class="brand-logo">
                    <span class="logo-icon">⚡</span>
                    <span class="brand-name">LINKFORGE</span>
                </a>
            </div>
        </header>

        <main class="main-content">
            <section class="status-card error-card">
                <div class="error-icon-badge">⚠️</div>
                <h1 class="status-title">{{ error_title or "Something Went Wrong" }}</h1>
                <p class="error-description">
                    {{ error_message or "The page or media you were looking for could not be found or processed." }}
                </p>
                <div style="margin-top: 1.5rem;">
                    <a href="/" class="primary-btn">Return to Home</a>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
